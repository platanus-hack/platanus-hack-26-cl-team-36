<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chameleon Mode</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="interruptor.css" />
    <link rel="stylesheet" href="idioma.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body data-activo="cargando">
    <main class="mt-panel">
      <header class="mt-cabecera">
        <img class="mt-marca" src="../brand/logo-horizontal-on-dark.svg" width="184" height="40" alt="Chameleon Mode" />
      </header>

      <section class="mt-control" aria-label="Encender o apagar Chameleon">
        <button type="button" class="mt-interruptor" id="mt-interruptor" aria-pressed="false" aria-labelledby="mt-interruptor-nombre mt-estado" aria-describedby="mt-alcance mt-estado-ayuda" disabled>
          <span class="mt-interruptor-simbolo" aria-hidden="true">
            <img class="mt-simbolo-on" src="../icons/extension-on.svg" width="72" height="72" alt="" />
            <img class="mt-simbolo-off" src="../icons/extension-off.svg" width="72" height="72" alt="" />
          </span>
          <span class="mt-interruptor-textos">
            <span class="mt-oculto-visual" id="mt-interruptor-nombre">Chameleon Mode</span>
            <span class="mt-estado" id="mt-estado">Cargando…</span>
            <span class="mt-estado-ayuda" id="mt-estado-ayuda"></span>
          </span>
          <span class="mt-riel" aria-hidden="true"><span class="mt-perilla"></span></span>
          <span class="mt-oculto-visual" id="mt-chip" aria-hidden="true">…</span>
        </button>
        <p class="mt-alcance" id="mt-alcance" data-mt-texto="interruptor.alcance">En todos los sitios compatibles</p>
        <p class="mt-pagina" id="mt-pagina" role="status" aria-live="polite"></p>
      </section>

      <details class="mt-opinion-panel" id="mt-opinion-panel">
        <summary class="mt-opinion-resumen"><span data-mt-texto="opinion.titulo">Compartir opinión</span><svg class="mt-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg></summary>
        <section class="mt-opinion" id="mt-opinion" data-modo="cargando" aria-labelledby="mt-pregunta">
          <div class="mt-votar">
            <p class="mt-pregunta" id="mt-pregunta" data-mt-texto="opinion.pregunta">¿Esta página es mejor para ti que la original?</p>
            <div class="mt-opciones" role="group" aria-labelledby="mt-pregunta">
              <button type="button" class="mt-opcion mt-opcion-tema" data-voto="mejor" aria-pressed="false"><span class="mt-opcion-texto" data-mt-texto="opinion.mejor">Mejor</span></button>
              <button type="button" class="mt-opcion mt-opcion-tema" data-voto="peor" aria-pressed="false"><span class="mt-opcion-texto" data-mt-texto="opinion.peor">Peor</span></button>
              <button type="button" class="mt-opcion" data-voto="comentario" aria-pressed="false"><span class="mt-opcion-texto" data-mt-texto="opinion.soloComentar">Solo quiero comentar</span></button>
            </div>
          </div>
          <p class="mt-aviso" id="mt-aviso"></p>
          <form class="mt-formulario" id="mt-formulario" novalidate>
            <label class="mt-oculto-visual" for="mt-comentario" data-mt-texto="opinion.comentario">Comentario</label>
            <textarea class="mt-comentario" id="mt-comentario" rows="3" maxlength="2000" placeholder="Cuéntanos qué cambiarías (opcional)"></textarea>
            <div class="mt-envio">
              <p class="mt-mensaje" id="mt-mensaje" role="status" aria-live="polite"></p>
              <p class="mt-pista" id="mt-pista"></p>
              <button type="submit" class="mt-enviar" id="mt-enviar" disabled>Enviar</button>
            </div>
          </form>
          <footer class="mt-pie"><p class="mt-pendientes" id="mt-pendientes"></p><p class="mt-privacidad" id="mt-privacidad"></p></footer>
        </section>
      </details>

      <footer class="mt-preferencias" data-mt-texto-aria-label="preferencias.etiqueta" aria-label="Preferencias">
        <button type="button" class="mt-efectos" id="mt-efectos" role="switch" aria-checked="true" data-mt-texto-title="efectos.ayuda" title="Encendido: transición llamativa al encender y apagar. Apagado: un fundido sutil.">
          <span class="mt-efectos-texto" data-mt-texto="efectos.etiqueta">Efectos</span>
          <span class="mt-efectos-riel" aria-hidden="true"><span class="mt-efectos-perilla"></span></span>
        </button>
          <div class="mt-idioma" id="mt-idioma">
            <button
              type="button"
              class="mt-idioma-boton"
              id="mt-idioma-boton"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="mt-idioma-lista"
              aria-label="Idioma: Español. Cambiar idioma"
            >
              <svg class="mt-idioma-globo" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z" />
              </svg>
              <span class="mt-idioma-actual" id="mt-idioma-actual" aria-hidden="true">ES</span>
              <svg class="mt-idioma-flecha" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 10l5 5 5-5" />
              </svg>
            </button>
            <ul class="mt-idioma-lista" id="mt-idioma-lista" role="listbox" tabindex="-1" data-mt-texto-aria-label="idioma.lista" hidden>
              <li class="mt-idioma-opcion" id="mt-idioma-es" role="option" data-idioma="es" lang="es" aria-selected="true">
                <span class="mt-idioma-codigo" aria-hidden="true">ES</span>
                <span class="mt-idioma-nombre">Español</span>
                <svg class="mt-idioma-marca" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              </li>
              <li class="mt-idioma-opcion" id="mt-idioma-en" role="option" data-idioma="en" lang="en" aria-selected="false">
                <span class="mt-idioma-codigo" aria-hidden="true">EN</span>
                <span class="mt-idioma-nombre">English</span>
                <svg class="mt-idioma-marca" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              </li>
            </ul>
          </div>

      </footer>
    </main>
  </body>
</html>
