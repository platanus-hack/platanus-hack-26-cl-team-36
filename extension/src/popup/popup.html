<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chameleon</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="interruptor.css" />
    <link rel="stylesheet" href="idioma.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body data-activo="cargando">
    <main class="mt-panel">
      <header class="mt-cabecera">
        <p class="mt-marca">Chameleon</p>
        <!-- Interruptor «Efectos» (centrado): marcado, el encendido y apagado son llamativos (la metamorfosis);
             sin marcar, sutiles (un fundido). popup.js guarda `efectos` en storage.local (comun/efectos.js). -->
        <button type="button" class="mt-efectos" id="mt-efectos" role="switch" aria-checked="true" data-mt-texto-title="efectos.ayuda" title="Encendido: transición llamativa al encender y apagar. Apagado: un fundido sutil.">
          <span class="mt-efectos-texto" data-mt-texto="efectos.etiqueta">Efectos</span>
          <span class="mt-efectos-riel" aria-hidden="true"><span class="mt-efectos-perilla"></span></span>
        </button>
        <div class="mt-cabecera-controles">
          <!-- Selector de idioma: botón + lista (patrón listbox). popup/idioma.js lo maneja; los
               textos de todo el popup salen de comun/idioma.js (data-mt-texto*). -->
          <div class="mt-idioma" id="mt-idioma">
            <button
              type="button"
              class="mt-idioma-boton"
              id="mt-idioma-boton"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="mt-idioma-lista"
              aria-label="Idioma: Español. Cambiar idioma"
            >
              <svg class="mt-idioma-globo" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z" />
              </svg>
              <span class="mt-idioma-actual" id="mt-idioma-actual" aria-hidden="true">ES</span>
              <svg class="mt-idioma-flecha" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 10l5 5 5-5" />
              </svg>
            </button>
            <ul class="mt-idioma-lista" id="mt-idioma-lista" role="listbox" tabindex="-1" data-mt-texto-aria-label="idioma.lista" hidden>
              <li class="mt-idioma-opcion" id="mt-idioma-es" role="option" data-idioma="es" lang="es" aria-selected="true">
                <span class="mt-idioma-codigo" aria-hidden="true">ES</span>
                <span class="mt-idioma-nombre">Español</span>
                <svg class="mt-idioma-marca" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              </li>
              <li class="mt-idioma-opcion" id="mt-idioma-en" role="option" data-idioma="en" lang="en" aria-selected="false">
                <span class="mt-idioma-codigo" aria-hidden="true">EN</span>
                <span class="mt-idioma-nombre">English</span>
                <svg class="mt-idioma-marca" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              </li>
            </ul>
          </div>
          <p class="mt-chip" id="mt-chip" aria-hidden="true">…</p>
        </div>
      </header>

      <!-- Opinión sobre la página (arriba, a pedido del usuario). data-modo lo pone popup.js:
           "completa" | "solo-comentario" | "no-disponible" | "cargando" (ver estado.js). -->
      <section class="mt-opinion" id="mt-opinion" data-modo="cargando" aria-labelledby="mt-opinion-titulo">
        <h1 class="mt-opinion-titulo" id="mt-opinion-titulo" data-mt-texto="opinion.titulo">Ayúdanos a mejorar tu experiencia</h1>
        <!-- La pregunta con sus opciones y el aviso comparten un mismo lugar (popup.css): al pasar de "completa" a
             "solo-comentario" la tarjeta no cambia de alto y el interruptor de abajo no se mueve. -->
        <div class="mt-eleccion">
          <div class="mt-votar">
            <p class="mt-pregunta" id="mt-pregunta" data-mt-texto="opinion.pregunta">¿Esta página es mejor para ti que la original?</p>
            <div class="mt-opciones" role="group" aria-labelledby="mt-pregunta">
              <button type="button" class="mt-opcion mt-opcion-tema" data-voto="mejor" aria-pressed="false">
                <svg class="mt-opcion-icono" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
                <span class="mt-opcion-texto" data-mt-texto="opinion.mejor">Mejor</span>
              </button>
              <button type="button" class="mt-opcion mt-opcion-tema" data-voto="peor" aria-pressed="false">
                <svg class="mt-opcion-icono" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12l7 7 7-7" />
                </svg>
                <span class="mt-opcion-texto" data-mt-texto="opinion.peor">Peor</span>
              </button>
              <button type="button" class="mt-opcion" data-voto="comentario" aria-pressed="false">
                <svg class="mt-opcion-icono" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 5h16v11H9l-5 4z" />
                </svg>
                <span class="mt-opcion-texto" data-mt-texto="opinion.soloComentar">Solo quiero comentar</span>
              </button>
            </div>
          </div>
          <p class="mt-aviso" id="mt-aviso"></p>
        </div>

        <form class="mt-formulario" id="mt-formulario" novalidate>
          <label class="mt-oculto-visual" for="mt-comentario" data-mt-texto="opinion.comentario">Comentario</label>
          <textarea
            class="mt-comentario"
            id="mt-comentario"
            rows="2"
            maxlength="2000"
            placeholder="Cuéntanos qué cambiarías (opcional)"
          ></textarea>

          <div class="mt-envio">
            <p class="mt-mensaje" id="mt-mensaje" role="status" aria-live="polite"></p>
            <p class="mt-pista" id="mt-pista"></p>
            <button type="submit" class="mt-enviar" id="mt-enviar" disabled>Enviar</button>
          </div>
        </form>

        <footer class="mt-pie">
          <p class="mt-pendientes" id="mt-pendientes"></p>
          <p class="mt-privacidad" data-mt-texto="opinion.privacidad">
            Al enviar se guarda una copia de esta página (antes y después del tema) solo en tu equipo.
          </p>
        </footer>
      </section>

      <!-- Interruptor ON/OFF: guarda `activo` en storage.local y content/motor.js anima el cambio. -->
      <section class="mt-control" aria-label="Encender o apagar Chameleon">
        <button type="button" class="mt-interruptor" id="mt-interruptor" aria-pressed="false" aria-describedby="mt-estado-ayuda" disabled>
          <!-- Todo lo de adentro es decorativo (aria-hidden); lo anima interruptor.css según body[data-activo]
               y las clases temporales mt-despertando / mt-durmiendo que pone interruptor.js. -->
          <span class="mt-aura" aria-hidden="true"></span>
          <span class="mt-onda" aria-hidden="true"></span>
          <span class="mt-anillo" aria-hidden="true"></span>
          <span class="mt-disco" aria-hidden="true">
