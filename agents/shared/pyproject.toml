[project]
name = "shared"
version = "0.1.0"
description = "Almacén de las salidas de los agentes: las mismas claves en disco y en S3."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.35.20"]   # necesita IfNoneMatch en put_object

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared.store"

[tool.pytest.ini_options]
testpaths = ["tests"]
