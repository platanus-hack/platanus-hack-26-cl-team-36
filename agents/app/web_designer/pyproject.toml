[project]
name = "web_designer"
version = "0.1.0"
description = "Diseñador: genera un tema (CSS bajo html.mi-tema) con un skill y lo mide en un sitio real."
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.48",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Se corre con `uv run main.py`; no se empaqueta.
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../web_evaluator"]
testpaths = ["tests"]
