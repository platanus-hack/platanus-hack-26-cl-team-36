[project]
name = "web_designer"
version = "0.1.0"
description = "Diseñador: genera un tema (CSS bajo html.mi-tema) con un skill y lo mide en un sitio real."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared[browser,pixels,bedrock,agentcore]",   # motor y navegador en AWS (AGENTS_ENGINE, AGENTS_BROWSER)
    "playwright>=1.48",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Se corre con `uv run main.py`; no se empaqueta.
package = false

[tool.uv.sources]
shared = { path = "../../shared", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
