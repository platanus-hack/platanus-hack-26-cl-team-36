[project]
name = "conductor"
version = "0.1.0"
description = "Conductor: encadena las etapas de una revisión (catálogo, Guía y Visitante por objetivo, mejora)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared[s3]",   # almacén en S3 (AGENTS_STORE); boto3 trae también el cliente bedrock-agentcore del invocador
]

[dependency-groups]
# Playwright solo para que CI instale el Chromium que usan las apps en la prueba de punta a punta: su misma versión.
dev = ["pytest>=8.0", "playwright==1.65.2"]

[tool.uv]
# Se corre con `uv run main.py`; no se empaqueta.
package = false

[tool.uv.sources]
shared = { path = "../../shared", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
