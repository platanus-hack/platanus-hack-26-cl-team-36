[project]
name = "web_evaluator"
version = "0.1.0"
description = "Usuarios sintéticos que intentan una tarea en un sitio web y unen sus recorridos en un árbol de rutas."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "playwright>=1.48",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Módulos planos que se corren con `uv run main.py`, como un agente de AgentCore: no se empaqueta.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
