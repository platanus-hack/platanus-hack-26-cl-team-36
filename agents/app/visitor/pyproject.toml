[project]
name = "visitor"
version = "0.1.0"
description = "Visitante: usuarios sintéticos que intentan una tarea en un sitio viendo solo capturas."
requires-python = ">=3.12,<3.13"   # la imagen de AgentCore usa la misma versión (agents/app/runtime/Dockerfile)
dependencies = [
    "shared[browser,pixels,s3]",   # boto3 ya llega con anthropic[bedrock]: el extra no suma paquetes
    "anthropic[bedrock]>=2.12",
    "playwright>=1.48",
    "bedrock-agentcore>=1.27",
    "aws-opentelemetry-distro>=0.10",   # AgentCore arranca el código con opentelemetry-instrument
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Se corre con `uv run main.py`; no se empaqueta.
package = false

[tool.uv.sources]
# En la imagen del runtime chameleon se copia con la misma ruta relativa (ver agents/app/runtime/Dockerfile).
shared = { path = "../../shared", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
