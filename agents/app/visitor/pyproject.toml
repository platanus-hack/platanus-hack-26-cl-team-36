[project]
name = "visitor"
version = "0.1.0"
description = "Visitante: usuarios sintéticos que intentan una tarea en un sitio viendo solo capturas."
requires-python = ">=3.12,<3.13"   # la imagen de AgentCore usa la misma versión (Dockerfile)
dependencies = [
    "shared[browser,pixels]",
    "anthropic[bedrock]>=2.12",
    "playwright>=1.48",
    "bedrock-agentcore>=1.27",
    "aws-opentelemetry-distro>=0.10",   # AgentCore arranca el código con opentelemetry-instrument
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Se corre con `uv run main.py`, como un agente de AgentCore: no se empaqueta.
package = false

[tool.uv.sources]
# En AgentCore la CLI lo instala sin editable desde uv.lock.
shared = { path = "../../shared", editable = true }

[tool.agentcore]
# Entrada en AgentCore Runtime; main.py es el comando local. La CLI copia esto a infra/agentcore/agentcore.json.
entrypoint = "agentcore_app.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
